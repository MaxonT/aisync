# What: tag-triggered release for aisync: GitHub Release (wheel + sdist) and a ghcr.io image.
# Why: every version ships a GitHub Release (wheel + sdist) and a container image, never an empty sidebar.
# How: bump the version in pyproject.toml, push tag vX.Y.Z; or run by hand
#      (workflow_dispatch) to re-publish an existing tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read          # least privilege at workflow level; write is granted per job below

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG != pyproject version $version"; exit 1; }

      - name: Tests (pytest and mcp are test-only; the package stays stdlib-only)
        run: |
          python -m pip install -q pytest "mcp>=2.3,<3"
          python -m pytest -q tests

      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist .

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*   # no --clobber: a re-run must not replace published bytes
          else
            gh release create "$TAG" dist/* --title "aisync ${TAG#v}" --generate-notes
          fi

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Container image on GitHub Packages
        run: |
          image=ghcr.io/maxont/aisync
          docker build -t "$image:${TAG#v}" -t "$image:latest" .
          docker run --rm "$image:${TAG#v}" --version
          docker push "$image:${TAG#v}"
          docker push "$image:latest"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  install-check:
    # the public one-liner in a clean container, against the Release that was just published
    needs: release
    runs-on: ubuntu-latest
    container: python:3.12-slim
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: curl install.sh | bash
        run: |
          apt-get update -qq && apt-get install -y -qq curl git
          # --version ties the check to this tag, not to whatever version the live site pins
          # the install script of THIS tag, not the live site copy
          curl -fsSL "https://raw.githubusercontent.com/MaxonT/aisync/${TAG}/docs/install.sh" | bash -s -- --version "${TAG#v}"
      - name: The installed command is this release
        run: |
          export PATH="$HOME/.local/bin:$PATH" AISYNC_NO_NOTIFY=1
          test "$(aisync --version)" = "aisync ${TAG#v}"
          aisync demo --dir /tmp/demo
          AISYNC_HOME=/tmp/demo aisync verify

  publish-pypi:
    # PyPI through Trusted Publishing: no token is stored. PyPI must have a publisher for
    # MaxonT/aisync + release.yml (set once on pypi.org). Runs only after the GitHub Release exists.
    needs: [release, install-check]   # a wheel that fails the clean-container install never reaches PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true   # a re-run must not fail on a version PyPI already has

  publish-github-npm:
    # The npm package on GitHub Packages (shows in the repo sidebar). Uses only GITHUB_TOKEN with packages: write.
    # The npmjs.org copy is published separately by the owner (2FA approval). The name is scoped to the owner.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@maxont'
      - name: Publish @maxont/aisync-cli to GitHub Packages
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p 'require("./package.json").version')" = "${TAG#v}"
          node -e 'const f="package.json";const p=require("./"+f);p.name="@maxont/aisync-cli";p.publishConfig={registry:"https://npm.pkg.github.com"};require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
          npm publish --access public
