# What: tag-triggered release for aisync: GitHub Release (wheel + sdist) and a ghcr.io image.
# Why: every version ships a GitHub Release (wheel + sdist) and a container image, never an empty sidebar.
# How: bump the version in pyproject.toml, push tag vX.Y.Z; or run by hand
#      (workflow_dispatch) to re-publish an existing tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG != pyproject version $version"; exit 1; }

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist .

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "aisync ${TAG#v}" --generate-notes
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Container image on GitHub Packages
        run: |
          image=ghcr.io/maxont/aisync
          docker build -t "$image:${TAG#v}" -t "$image:latest" .
          docker run --rm "$image:${TAG#v}" --version
          docker push "$image:${TAG#v}"
          docker push "$image:latest"

  install-check:
    # the public one-liner in a clean container, against the Release that was just published
    needs: release
    runs-on: ubuntu-latest
    container: python:3.12-slim
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: curl install.sh | bash
        run: |
          apt-get update -qq && apt-get install -y -qq curl git
          curl -fsSL https://maxont.github.io/aisync/install.sh | bash
      - name: The installed command is this release
        run: |
          export PATH="$HOME/.local/bin:$PATH" AISYNC_NO_NOTIFY=1
          test "$(aisync --version)" = "aisync ${TAG#v}"
          aisync demo --dir /tmp/demo
          AISYNC_HOME=/tmp/demo aisync verify
