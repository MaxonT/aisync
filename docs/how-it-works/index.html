  <div class="bar">
    <button id="pp" aria-label="play / pause">⏸ Pause</button>
    <button id="prev" aria-label="previous step">◀</button>
    <button id="next" aria-label="next step">▶</button>
    <input id="seek" type="range" min="0" max="143" value="0" step="1">
    <span class="cap" id="cap">1 / 144</span>
  </div>
  <div class="hint">Space = play/pause · ← → = step · drag the bar to scrub</div>
</div>
<script>
(function(){
  var N=144, fps=12, i=0, playing=true, timer=null;
  var frs=[].slice.call(document.querySelectorAll('.fr'));
  var pp=document.getElementById('pp'), seek=document.getElementById('seek'),
      cap=document.getElementById('cap');
  function show(n){ i=(n%N+N)%N; frs.forEach(function(f){f.style.display='none';});
    frs[i].style.display='block'; seek.value=i; cap.textContent=(i+1)+' / '+N; }
  function step(){ if(playing) show(i+1); }
  function start(){ timer=setInterval(step,1000/fps); }
  function stop(){ clearInterval(timer); timer=null; }
  function setPlay(p){ playing=p; pp.textContent=p?'⏸ Pause':'▶ Play';
    if(p){ if(!timer) start(); } else { stop(); } }
  pp.onclick=function(){ setPlay(!playing); };
  document.getElementById('prev').onclick=function(){ setPlay(false); show(i-1); };
  document.getElementById('next').onclick=function(){ setPlay(false); show(i+1); };
  seek.oninput=function(){ setPlay(false); show(parseInt(seek.value,10)); };
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'){ e.preventDefault(); setPlay(!playing); }
    else if(e.code==='ArrowLeft'){ setPlay(false); show(i-1); }
    else if(e.code==='ArrowRight'){ setPlay(false); show(i+1); }
  });
  show(0); start();
})();
</script>
